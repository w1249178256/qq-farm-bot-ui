syntax = "proto3";

package gamepb.interactpb;

message InteractRecord {
    int64 server_time = 1;
    int32 action_type = 2;
    int64 visitor_gid = 3;
    string nick = 4;
    string avatar_url = 5;
    int32 crop_id = 6;
    int32 crop_count = 7;
    int32 times = 8;
    int32 from_type = 9;
    int32 level = 10;

    message Extra {
        int32 land_id = 1;
        int32 flag1 = 2;
        int32 flag2 = 3;
    }

    Extra extra = 11;
}

message InteractRecordsRequest {}

message InteractRecordsReply {
    repeated InteractRecord records = 1;
}

// ============ 互动详情 ============

message GetInteractInfoRequest {
    int64 host_gid = 1;
}

message GetInteractInfoReply {
    bytes data = 1;
}

message GetInteractSummaryRequest {}

message GetInteractSummaryReply {
    bytes data = 1;
}

message DismissInteractPopupRequest {}

message DismissInteractPopupReply {}

// ============ 删除互动记录 ============

message DeleteInteractionsRequest {
    repeated int64 record_ids = 1;
}

message DeleteInteractionsResponse {}

// ============ 服务器推送 ============

message InteractNewRecordNotify {
    InteractRecord record = 1;
}
