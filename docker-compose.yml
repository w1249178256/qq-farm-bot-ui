services:
  qq-farm-bot-ui:
    build:
      context: .
      dockerfile: core/Dockerfile
    container_name: qq-farm-bot-ui
    restart: unless-stopped
    environment:
      ADMIN_PASSWORD: admin
      ADMIN_PORT: 8808
      TZ: Asia/Shanghai
    ports:
      - "8808:8808"
    volumes:
      - ./data:/app/core/data
